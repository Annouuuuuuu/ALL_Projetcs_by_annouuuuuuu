<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observer Pattern - Messagerie Temps Réel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .instance-id {
            font-size: 14px;
            opacity: 0.9;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .connection-status {
            display: inline-block;
            margin-left: 10px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .connection-status.connected {
            background: #4caf50;
        }

        .connection-status.disconnected {
            background: #f44336;
        }

        .messages-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #ffffff;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            animation: slideIn 0.3s ease;
            background: #f0f0f0;
            border-left: 4px solid #667eea;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            background: #e3f2fd;
        }

        .message.received {
            background: #f3e5f5;
        }

        .message .time {
            font-size: 11px;
            color: #999;
            margin-right: 8px;
        }

        .message-content {
            font-size: 15px;
            color: #333;
        }

        .input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .input-container button:hover {
            transform: scale(1.05);
        }

        .input-container button:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔔 Observer Pattern - Messagerie Temps Réel</h1>
            <div class="instance-id" id="instanceId"></div>
            <span class="connection-status disconnected" id="connectionStatus">Déconnecté</span>
        </div>

        <div class="messages-container" id="messages">
            <div class="empty-state">
                <span style="font-size: 48px;">💬</span>
                <p>Aucun message pour le moment</p>
                <p style="font-size: 14px; margin-top: 10px;">Envoyez un message pour commencer</p>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Écrivez votre message...">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ========== Génération ID instance ==========
        const instanceId = `User-${Math.random().toString(36).substr(2, 5)}`;
        document.getElementById('instanceId').textContent = instanceId;

        // ========== Fonction utilitaire ==========
        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('fr-FR', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // ========== Fonction d'ajout de message ==========
        function addMessage({ from, message, sent }) {
            const container = document.getElementById('messages');
            
            // Retirer le message vide si présent
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const msg = document.createElement('div');
            msg.className = 'message ' + (sent ? 'sent' : 'received') + ' time';
            msg.setAttribute('data-time', getCurrentTime());
            msg.innerHTML = `<span class="time">${getCurrentTime()}</span><span class="message-content">${from}: ${message}</span>`;
            
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        // ========== PATTERN OBSERVER (NotificationManager) ==========
        
        class NotificationManager {
            constructor() {
                this.observers = [];
            }

            subscribe(fn) {
                this.observers.push(fn);
            }

            notify(data) {
                this.observers.forEach(fn => fn(data));
            }
        }

        const notificationManager = new NotificationManager();

        // Abonner une fonction qui affiche une alerte
        notificationManager.subscribe(({ from }) => {
            console.log(`🔔 Nouveau message de ${from}`);
        });

        // Abonner une fonction qui ajoute le message au DOM
        notificationManager.subscribe((data) => {
            addMessage(data);
        });

        // ========== WEBSOCKET ==========
        
        const socket = io();

        socket.on('connect', () => {
            console.log('Connecté au serveur');
            const statusEl = document.getElementById('connectionStatus');
            statusEl.textContent = 'Connecté';
            statusEl.className = 'connection-status connected';
        });

        socket.on('disconnect', () => {
            console.log('Déconnecté du serveur');
            const statusEl = document.getElementById('connectionStatus');
            statusEl.textContent = 'Déconnecté';
            statusEl.className = 'connection-status disconnected';
        });

        socket.on('receive_notification', (data) => {
            notificationManager.notify(data);
        });

        // ========== ENVOI DE MESSAGE ==========
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                socket.emit('send_notification', { 
                    from: instanceId, 
                    message: message,
                    sent: true 
                });
                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
